replicaCount: 2

image:
  repository: enterprisebot-devops-platform
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8080

config:
  appName: demo-service
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
